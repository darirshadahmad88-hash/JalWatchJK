[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/mandi-prices"
  to = "/.netlify/functions/mandi-prices"
  status = 200

[[redirects]]
  from = "/api/soil-moisture"
  to = "/.netlify/functions/soil-moisture"
  status = 200

[[redirects]]
  from = "/api/flood-level"
  to = "/.netlify/functions/flood-level"
  status = 200

[[redirects]]
  from = "/api/rainfall"
  to = "/.netlify/functions/rainfall"
  status = 200

[[redirects]]
  from = "/api/farmer-brief"
  to = "/.netlify/functions/farmer-brief"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
